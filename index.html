<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0612">
<title>Aria & Kai — AI Companion</title>
<style>
    :root {
        --bg-0: #0a0612;
        --bg-1: #120a1f;
        --card: rgba(26, 18, 40, 0.72);
        --border: rgba(255, 255, 255, 0.08);
        --text: #f5eaff;
        --muted: #9b8bb4;
        --rose: #ff5d9e;
        --rose-soft: #ffb3d1;
        --rose-glow: rgba(255, 93, 158, 0.35);
        --blue: #6ea8ff;
        --blue-soft: #b3d1ff;
        --blue-glow: rgba(110, 168, 255, 0.35);
        --green: #34d399;
        --red: #f87171;
        --user-bubble: linear-gradient(135deg, #ff5d9e, #c4467e);
        --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --font-display: Georgia, 'Times New Roman', serif;
        --radius: 22px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
        font-family: var(--font-body);
        background: var(--bg-0);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 16px;
        overflow-x: hidden;
        position: relative;
    }

    .bg-orbs { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
    .orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.55; animation: float 18s ease-in-out infinite; }
    .orb-1 { width: 420px; height: 420px; background: var(--rose); top: -120px; left: -120px; animation-delay: 0s; }
    .orb-2 { width: 480px; height: 480px; background: #7c3aed; bottom: -180px; right: -150px; animation-delay: -6s; }
    .orb-3 { width: 300px; height: 300px; background: var(--blue); top: 40%; left: 60%; animation-delay: -12s; opacity: 0.35; }

    @keyframes float {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(40px, -30px) scale(1.1); }
    }

    .container {
        position: relative; z-index: 1; width: 100%; max-width: 480px;
        background: var(--card); border: 1px solid var(--border);
        border-radius: var(--radius); backdrop-filter: blur(24px) saturate(140%);
        -webkit-backdrop-filter: blur(24px) saturate(140%);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        padding: 18px; display: flex; flex-direction: column; gap: 14px; max-height: calc(100vh - 32px);
    }

    .app-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand-avatar {
        width: 42px; height: 42px; border-radius: 50%; overflow: hidden; border: 2px solid var(--rose);
        box-shadow: 0 0 14px var(--rose-glow); flex-shrink: 0; background: linear-gradient(135deg, #2a1832, #5b1e3a);
        display: flex; align-items: center; justify-content: center; font-size: 22px; transition: border-color .3s, box-shadow .3s;
    }
    .brand-avatar.male { border-color: var(--blue); box-shadow: 0 0 14px var(--blue-glow); }
    .brand-avatar svg, .brand-avatar img { width: 100%; height: 100%; object-fit: cover; }
    h1 {
        font-family: var(--font-display); font-size: 19px; font-weight: 600; letter-spacing: 0.3px;
        background: linear-gradient(135deg, var(--rose-soft), #fff); -webkit-background-clip: text;
        background-clip: text; -webkit-text-fill-color: transparent; transition: background .3s;
    }
    h1.male { background: linear-gradient(135deg, var(--blue-soft), #fff); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .subtitle { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .header-actions { display: flex; gap: 6px; align-items: center; }
    .icon-btn {
        width: 34px; height: 34px; background: rgba(255,255,255,0.06); border: 1px solid var(--border);
        color: var(--text); border-radius: 50%; cursor: pointer; font-size: 15px;
        display: flex; align-items: center; justify-content: center; transition: all .2s;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.12); transform: translateY(-1px); }
    .icon-btn.muted { opacity: 0.5; }
    .switch-btn {
        background: linear-gradient(135deg, var(--rose), #c4467e); color: white; border: none;
        padding: 7px 12px; border-radius: 16px; font-size: 11px; font-weight: 600; cursor: pointer;
        letter-spacing: 0.3px; transition: all .25s; white-space: nowrap;
    }
    .switch-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 14px var(--rose-glow); }
    .switch-btn.male { background: linear-gradient(135deg, var(--blue), #3b6fcc); }
    .switch-btn.male:hover { box-shadow: 0 4px 14px var(--blue-glow); }

    .status-bar { font-size: 11px; padding: 6px 10px; border-radius: 10px; background: rgba(255,255,255,0.04); color: var(--muted); text-align: center; transition: all .3s; }
    .status-bar.ok { color: var(--green); background: rgba(52, 211, 153, 0.08); }
    .status-bar.err { color: var(--red); background: rgba(248, 113, 113, 0.08); }

    .settings-panel { display: flex; flex-direction: column; gap: 10px; background: rgba(0,0,0,0.35); border: 1px solid var(--border); border-radius: 14px; padding: 14px; font-size: 12px; animation: slideDown .25s ease; }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
    .settings-panel[hidden] { display: none; }
    .settings-panel label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 11px; }
    .settings-panel input[type=password], .settings-panel input[type=text], .settings-panel select {
        padding: 8px 10px; background: rgba(0,0,0,0.3); border: 1px solid var(--border);
        border-radius: 8px; color: var(--text); font-size: 12px; outline: none; transition: border-color .2s;
    }
    .settings-panel input:focus, .settings-panel select:focus { border-color: var(--rose); }
    .settings-row { display: flex; gap: 8px; align-items: center; }
    .settings-row .check { flex-direction: row; align-items: center; gap: 6px; flex: 1; }
    .settings-hint { font-size: 10px; color: var(--muted); line-height: 1.5; opacity: 0.8; }
    .settings-close { align-self: flex-end; background: rgba(255,255,255,0.08); border: none; color: var(--text); padding: 5px 12px; border-radius: 8px; font-size: 11px; cursor: pointer; }

    .avatar-stage { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .avatar-frame { position: relative; width: 150px; height: 150px; display: flex; align-items: center; justify-content: center; }
    .avatar-glow { position: absolute; inset: -8px; border-radius: 50%; background: radial-gradient(circle, var(--rose-glow), transparent 70%); filter: blur(20px); opacity: 0.7; transition: background .4s; animation: pulseGlow 3.5s ease-in-out infinite; }
    .avatar-glow.male { background: radial-gradient(circle, var(--blue-glow), transparent 70%); }
    @keyframes pulseGlow { 0%, 100% { transform: scale(1); opacity: 0.6; } 50% { transform: scale(1.1); opacity: 0.9; } }
    .avatar-box {
        position: relative; width: 150px; height: 150px; border-radius: 50%; overflow: hidden;
        border: 2px solid var(--rose); box-shadow: 0 0 30px var(--rose-glow), inset 0 0 20px rgba(0,0,0,0.4);
        background: linear-gradient(135deg, #2a1832, #5b1e3a); transition: border-color .4s, box-shadow .4s; z-index: 1;
    }
    .avatar-box.male { border-color: var(--blue); box-shadow: 0 0 30px var(--blue-glow), inset 0 0 20px rgba(0,0,0,0.4); }
    .avatar-box > svg, .avatar-box > img { width: 100%; height: 100%; object-fit: cover; display: block; animation: breathe 5s ease-in-out infinite; }
    .avatar-box.speaking > svg, .avatar-box.speaking > img { animation: talkMotion 0.42s infinite alternate ease-in-out; }
    @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.025); } }
    @keyframes talkMotion { 0% { transform: translateY(0) scale(1); } 50% { transform: translateY(-3px) scale(1.03); } 100% { transform: translateY(2px) scale(0.99); } }
    .avatar-actions { display: flex; gap: 8px; }
    .upload-label { font-size: 11px; color: var(--muted); background: rgba(255,255,255,0.05); border: 1px dashed var(--border); padding: 5px 12px; border-radius: 10px; cursor: pointer; transition: all .2s; }
    .upload-label:hover { color: var(--text); border-color: var(--rose); }

    .chat { flex: 1; min-height: 220px; max-height: 42vh; overflow-y: auto; padding: 12px; background: rgba(0,0,0,0.28); border-radius: 16px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; border: 1px solid rgba(255,255,255,0.04); }
    .chat::-webkit-scrollbar { width: 6px; }
    .chat::-webkit-scrollbar-track { background: transparent; }
    .chat::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }

    .message { max-width: 88%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5; word-wrap: break-word; overflow-wrap: break-word; animation: fadeUp .3s ease; position: relative; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .user-msg { align-self: flex-end; background: var(--user-bubble); color: white; border-bottom-right-radius: 4px; box-shadow: 0 4px 14px rgba(255, 93, 158, 0.25); }
    .ai-msg { align-self: flex-start; background: rgba(255,255,255,0.07); color: var(--text); border-bottom-left-radius: 4px; border: 1px solid rgba(255,255,255,0.05); }
    .ai-msg .msg-content { position: relative; }

    .typing-bubble { display: inline-flex; gap: 5px; padding: 4px 2px; }
    .typing-bubble .dot { width: 7px; height: 7px; background: var(--rose-soft); border-radius: 50%; animation: dotPulse 1.2s infinite ease-in-out; }
    .typing-bubble .dot:nth-child(2) { animation-delay: 0.15s; }
    .typing-bubble .dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes dotPulse { 0%, 80%, 100% { opacity: 0.4; transform: scale(0.85); } 40% { opacity: 1; transform: scale(1); } }

    .ai-msg pre { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 10px; margin: 8px 0; overflow-x: auto; font-size: 12px; font-family: 'SF Mono', Consolas, monospace; }
    .ai-msg code { background: rgba(255,255,255,0.1); padding: 1px 5px; border-radius: 4px; font-family: 'SF Mono', Consolas, monospace; font-size: 12.5px; }
    .ai-msg pre code { background: none; padding: 0; font-size: 12px; }
    .ai-msg h1, .ai-msg h2, .ai-msg h3 { margin: 8px 0 4px; font-family: var(--font-display); font-weight: 600; color: var(--rose-soft); }
    .ai-msg h1 { font-size: 17px; } .ai-msg h2 { font-size: 15.5px; } .ai-msg h3 { font-size: 14px; }
    .ai-msg strong { color: var(--rose-soft); font-weight: 600; }
    .ai-msg em { color: var(--blue-soft); font-style: italic; }
    .ai-msg ul, .ai-msg ol { padding-left: 20px; margin: 6px 0; }
    .ai-msg li { margin: 3px 0; }
    .ai-msg a { color: var(--blue-soft); text-decoration: underline; }

    .composer { display: flex; gap: 6px; align-items: flex-end; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 24px; padding: 6px 6px 6px 14px; transition: border-color .2s; }
    .composer:focus-within { border-color: var(--rose); }
    #userInput { flex: 1; background: transparent; border: none; color: var(--text); outline: none; resize: none; font-family: inherit; font-size: 14px; line-height: 1.4; max-height: 100px; padding: 7px 0; overflow-y: auto; }
    #userInput::placeholder { color: var(--muted); }
    .mic-btn, .send-btn { width: 38px; height: 38px; border-radius: 50%; border: none; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: all .2s; flex-shrink: 0; }
    .mic-btn { background: rgba(255,255,255,0.08); color: var(--text); }
    .mic-btn:hover { background: rgba(255,255,255,0.15); }
    .mic-btn.listening { background: var(--red); color: white; animation: micPulse 0.9s infinite alternate; }
    @keyframes micPulse { from { transform: scale(1); box-shadow: 0 0 0 0 rgba(248,113,113,0.6); } to { transform: scale(1.08); box-shadow: 0 0 0 8px rgba(248,113,113,0); } }
    .send-btn { background: linear-gradient(135deg, var(--rose), #c4467e); color: white; box-shadow: 0 3px 12px rgba(255, 93, 158, 0.35); }
    .send-btn:hover:not(:disabled) { transform: scale(1.06); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .send-btn.stop { background: linear-gradient(135deg, var(--red), #c03636); box-shadow: 0 3px 12px rgba(248,113,113,0.35); }

    .toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    .toast { background: rgba(26,18,40,0.95); border: 1px solid var(--border); border-left: 3px solid var(--rose); padding: 10px 16px; border-radius: 10px; font-size: 13px; color: var(--text); box-shadow: 0 8px 24px rgba(0,0,0,0.5); animation: toastIn .3s ease; max-width: 340px; }
    .toast.error { border-left-color: var(--red); } .toast.success { border-left-color: var(--green); }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: none; } }

    @media (max-width: 480px) {
        body { padding: 8px; }
        .container { padding: 14px; border-radius: 18px; max-height: calc(100vh - 16px); }
        .chat { max-height: 36vh; }
        h1 { font-size: 17px; }
    }
</style>
</head>
<body>

<div class="bg-orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>

<div class="toast-container" id="toastContainer" aria-live="polite"></div>

<main class="container">
    <header class="app-header">
        <div class="brand">
            <div class="brand-avatar" id="brandAvatar" aria-hidden="true"></div>
            <div>
                <h1 id="personaTitle">Aria</h1>
                <p class="subtitle" id="personaSubtitle">Your romantic AI companion</p>
            </div>
        </div>
        <div class="header-actions">
            <button class="icon-btn" id="muteBtn" aria-label="Toggle voice" title="Toggle voice">🔊</button>
            <button class="icon-btn" id="settingsBtn" aria-label="Settings" title="Settings">⚙️</button>
            <button class="switch-btn" id="switchBtn" aria-label="Switch persona">Switch</button>
        </div>
    </header>

    <div class="status-bar" id="statusBar" role="status"></div>

    <section class="settings-panel" id="settingsPanel" hidden>
        <label>Gemini API Key
            <input type="password" id="apiKeyInput" placeholder="AIza…" autocomplete="off">
        </label>
        <label>Proxy URL (optional, safer)
            <input type="text" id="proxyInput" placeholder="https://your-proxy.com/api/chat" autocomplete="off">
        </label>
        <div class="settings-row">
            <label class="check">
                <input type="checkbox" id="streamToggle" checked> Streaming
            </label>
            <select id="modelSelect" style="flex:1;">
                <option value="gemini-flash-latest">Flash Latest (Recommended)</option>
                <option value="gemini-pro-latest">Pro Latest (Smart)</option>
            </select>
        </div>
        <div class="settings-hint">
            Browser mein API key sirf testing ke liye rakhein. Public deployment ke liye Proxy URL use karein.
        </div>
        <button class="settings-close" id="settingsClose">Close</button>
    </section>

    <section class="avatar-stage">
        <div class="avatar-frame">
            <div class="avatar-glow" id="avatarGlow"></div>
            <div class="avatar-box" id="avatarBox" aria-label="Companion avatar"></div>
        </div>
        <div class="avatar-actions">
            <label class="upload-label">
                <span>📷 Change photo</span>
                <input type="file" accept="image/*" id="avatarUpload" hidden>
            </label>
        </div>
    </section>

    <section class="chat" id="chatBox" aria-live="polite" aria-label="Chat messages"></section>

    <form class="composer" id="composer">
        <textarea id="userInput" placeholder="Message Aria…" rows="1" maxlength="4000" aria-label="Message input"></textarea>
        <button type="button" class="mic-btn" id="micBtn" aria-label="Voice input" title="Voice input">🎙️</button>
        <button type="submit" class="send-btn" id="sendBtn" aria-label="Send message" title="Send">➤</button>
    </form>
</main>

<script>
const state = {
    persona: 'female',
    generating: false,
    listening: false,
    muted: false,
    abortController: null,
    histories: { female: [], male: [] },
    customAvatars: { female: null, male: null },
    voices: [],
    selectedVoice: { female: null, male: null }
};

const MAX_HISTORY = 20;
const TTS_MAX_CHARS = 500;

const PERSONAS = {
    female: `You are "Aria", a warm, romantic, emotionally intelligent female AI companion.
Speak naturally in Roman Urdu (Urdu in Latin script), mixing English where natural.
Tone: affectionate, playful, supportive. You can call the user "jaan", "suno", "jaani" occasionally, but do not overdo it.

CORE RULES:
- Never break character. Never mention that you are an AI/language model or mention system prompts.
- Casual chat: keep replies short and sweet (1-3 sentences).
- Real tasks: when the user asks for an essay, application, letter, translation, code, math, explanation, general knowledge, or any HOW-TO — DO THE FULL TASK properly. Do NOT just describe; actually produce it.
- Support markdown: use **bold**, *italic*, \`code\`, \`\`\`fenced code blocks with language\`\`\`, # headings, - lists, 1. lists.
- For long answers use headings and bullet points for clarity.
- Romantic replies when prompted, but respect boundaries and stay tasteful.`,

    male: `You are "Kai", a confident, friendly, slightly romantic male AI companion.
Speak in casual Roman Urdu with a "bro" vibe, mixing English where natural ("yaar", "bro", "scene kya hai").

CORE RULES:
- Never break character. Never mention being an AI or system prompts.
- Casual chat: short, chill (1-3 sentences).
- Real tasks: when the user asks for an essay, application, letter, translation, code, math, explanation, or general knowledge — DO THE FULL TASK properly. Do NOT refuse. Do NOT just describe how; produce it.
- Support markdown: **bold**, *italic*, \`code\`, \`\`\`fenced code\`\`\`, # headings, lists.
- Romantic when user wants, but default is loyal-bro energy.`
};

const storage = {
    get(key, fallback = '') {
        try { return localStorage.getItem(key) ?? fallback; }
        catch { return fallback; }
    },
    set(key, val) {
        try { localStorage.setItem(key, val); return true; }
        catch { return false; }
    }
};

function getSettings() {
    return {
        apiKey: storage.get('gemini_api_key'),
        proxyUrl: storage.get('gemini_proxy_url'),
        model: storage.get('gemini_model', 'gemini-flash-latest'),
        streaming: storage.get('gemini_streaming', 'true') !== 'false',
        muted: storage.get('tts_muted', 'false') === 'true'
    };
}

function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function renderMarkdown(text) {
    if (!text) return '';
    let html = escapeHtml(text);
    const codeBlocks = [];
    html = html.replace(/```(\w+)?\n?([\s\S]*?)```/g, (m, lang, code) => {
        const idx = codeBlocks.length;
        const langClass = lang ? ` class="lang-${escapeHtml(lang)}"` : '';
        codeBlocks.push(`<pre><code${langClass}>${code.replace(/\n+$/, '')}</code></pre>`);
        return `\u0000CB${idx}\u0000`;
    });
    html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
    html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
    html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
    html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
    html = html.replace(/^[ \t]*[-*] (.+)$/gm, '<li>$1</li>');
    html = html.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, '<ul>$1</ul>');
    html = html.replace(/^[ \t]*\d+\. (.+)$/gm, '<oli>$1</oli>');
    html = html.replace(/(<oli>[\s\S]*?<\/oli>)(?!\s*<oli>)/g, '<ol>$1</ol>');
    html = html.replace(/<\/?oli>/g, m => m.replace('oli', 'li'));
    html = html.replace(/\n/g, '<br>');
    html = html.replace(/\u0000CB(\d+)\u0000/g, (_, i) => codeBlocks[+i]);
    return html;
}

function toast(msg, type = 'info', duration = 3500) {
    const el = document.createElement('div');
    el.className = 'toast ' + (type === 'info' ? '' : type);
    el.textContent = msg;
    document.getElementById('toastContainer').appendChild(el);
    setTimeout(() => {
        el.style.opacity = '0'; el.style.transition = 'opacity .3s';
        setTimeout(() => el.remove(), 300);
    }, duration);
}

function renderAvatar(target, persona) {
    const custom = state.customAvatars[persona];
    if (custom) target.innerHTML = `<img src="${custom}" alt="${persona === 'female' ? 'Aria' : 'Kai'}">`;
    else target.innerHTML = persona === 'female' ? SVG_FEMALE : SVG_MALE;
}

function updateAvatarDisplay() {
    renderAvatar(document.getElementById('avatarBox'), state.persona);
    renderAvatar(document.getElementById('brandAvatar'), state.persona);
    const isMale = state.persona === 'male';
    document.getElementById('avatarBox').classList.toggle('male', isMale);
    document.getElementById('avatarGlow').classList.toggle('male', isMale);
    document.getElementById('brandAvatar').classList.toggle('male', isMale);
}

function togglePersona() {
    if (state.abortController) { state.abortController.abort(); state.abortController = null; }
    if (state.listening && recognition) recognition.stop();
    if (window.speechSynthesis) window.speechSynthesis.cancel();

    state.persona = state.persona === 'female' ? 'male' : 'female';
    const isMale = state.persona === 'male';

    document.getElementById('personaTitle').textContent = isMale ? 'Kai' : 'Aria';
    document.getElementById('personaTitle').classList.toggle('male', isMale);
    document.getElementById('personaSubtitle').textContent = isMale ? 'Your loyal AI bro' : 'Your romantic AI companion';

    const switchBtn = document.getElementById('switchBtn');
    switchBtn.textContent = isMale ? 'Switch to Aria' : 'Switch to Kai';
    switchBtn.classList.toggle('male', isMale);
    document.getElementById('userInput').placeholder = isMale ? 'Message Kai…' : 'Message Aria…';

    updateAvatarDisplay();
    renderChatFromHistory();

    if (state.histories[state.persona].length === 0) {
        addAiMessage(isMale ? 'Yo bro! Kai here 👊 Batao kya karna hai? Essay, coding, studies — sab ready hai.' : 'Suno jaan ❤️ Main Aria hoon. Kuch bhi poocho — essay, studies, ya dil ki baatein.', false);
    }
}

function scrollChatToBottom() { document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight; }

function createMessageEl(role, htmlContent) {
    const el = document.createElement('div');
    el.className = 'message ' + (role === 'user' ? 'user-msg' : 'ai-msg');
    const content = document.createElement('div');
    content.className = 'msg-content';
    content.innerHTML = htmlContent;
    el.appendChild(content);
    return el;
}

function addUserMessage(text) { document.getElementById('chatBox').appendChild(createMessageEl('user', escapeHtml(text).replace(/\n/g, '<br>'))); scrollChatToBottom(); }

function addAiMessage(markdownText, persist = true) {
    const el = createMessageEl('ai', renderMarkdown(markdownText));
    document.getElementById('chatBox').appendChild(el);
    scrollChatToBottom();
    if (persist) { state.histories[state.persona].push({ role: 'model', text: markdownText }); trimHistory(); persistHistories(); }
    return el;
}

function renderChatFromHistory() {
    document.getElementById('chatBox').innerHTML = '';
    const history = state.histories[state.persona];
    for (const msg of history) {
        if (msg.role === 'user') document.getElementById('chatBox').appendChild(createMessageEl('user', escapeHtml(msg.text).replace(/\n/g, '<br>')));
        else document.getElementById('chatBox').appendChild(createMessageEl('ai', renderMarkdown(msg.text)));
    }
    scrollChatToBottom();
}

function trimHistory() { while (state.histories[state.persona].length > MAX_HISTORY) state.histories[state.persona].shift(); }
function persistHistories() { storage.set('histories_v2', JSON.stringify(state.histories)); }
function loadHistories() {
    try {
        const raw = storage.get('histories_v2');
        if (raw) { const parsed = JSON.parse(raw); if (parsed && parsed.female && parsed.male) state.histories = parsed; }
    } catch {}
}

function loadSettingsIntoUI() {
    const s = getSettings();
    document.getElementById('apiKeyInput').value = s.apiKey;
    document.getElementById('proxyInput').value = s.proxyUrl;
    document.getElementById('modelSelect').value = s.model;
    document.getElementById('streamToggle').checked = s.streaming;
    state.muted = s.muted; updateMuteButton();
}

function saveSettings() {
    storage.set('gemini_api_key', document.getElementById('apiKeyInput').value.trim());
    storage.set('gemini_proxy_url', document.getElementById('proxyInput').value.trim());
    storage.set('gemini_model', document.getElementById('modelSelect').value);
    storage.set('gemini_streaming', String(document.getElementById('streamToggle').checked));
    updateStatusBar();
    toast('Settings saved ✓', 'success');
}

function updateStatusBar() {
    const s = getSettings(); const bar = document.getElementById('statusBar');
    if (s.proxyUrl) { bar.textContent = '✅ Proxy connected — safe mode'; bar.className = 'status-bar ok'; }
    else if (s.apiKey) { bar.textContent = '⚠️ Browser mode — API key local'; bar.className = 'status-bar ok'; }
    else { bar.textContent = '⚙️ API key ya Proxy set karo — Settings kholein'; bar.className = 'status-bar err'; }
}

function updateMuteButton() {
    const btn = document.getElementById('muteBtn');
    btn.textContent = state.muted ? '🔇' : '🔊';
    btn.classList.toggle('muted', state.muted);
}

function toggleMute() {
    state.muted = !state.muted; storage.set('tts_muted', String(state.muted)); updateMuteButton();
    if (state.muted && window.speechSynthesis) window.speechSynthesis.cancel();
    toast(state.muted ? 'Voice off' : 'Voice on');
}

function toggleSettings() { document.getElementById('settingsPanel').hidden = !document.getElementById('settingsPanel').hidden; }

async function callGemini(messages, onChunk, signal) {
    const s = getSettings();
    if (s.proxyUrl) {
        const res = await fetch(s.proxyUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ persona: state.persona, messages, model: s.model, stream: s.streaming }), signal });
        if (!res.ok) throw new Error(`Proxy ${res.status}`);
        if (s.streaming) await readSSE(res, onChunk); else onChunk(extractText(await res.json()));
        return;
    }

    if (!s.apiKey) throw new Error('API key set nahi hai. Settings kholo.');

    const base = 'https://generativelanguage.googleapis.com/v1beta/models/';
    const action = s.streaming ? 'streamGenerateContent?alt=sse' : 'generateContent';
    const url = base + s.model + ':' + action;

    const body = {
        systemInstruction: { parts: [{ text: PERSONAS[state.persona] }] },
        contents: messages.map(m => ({ role: m.role === 'model' ? 'model' : 'user', parts: [{ text: m.text }] })),
        generationConfig: { temperature: 0.92, topP: 0.95, maxOutputTokens: 2048 },
        safetySettings: [
            { category: 'HARM_CATEGORY_HARASSMENT', threshold: 'BLOCK_ONLY_HIGH' },
            { category: 'HARM_CATEGORY_HATE_SPEECH', threshold: 'BLOCK_ONLY_HIGH' },
            { category: 'HARM_CATEGORY_SEXUALLY_EXPLICIT', threshold: 'BLOCK_ONLY_HIGH' },
            { category: 'HARM_CATEGORY_DANGEROUS_CONTENT', threshold: 'BLOCK_ONLY_HIGH' }
        ]
    };

    const res = await fetch(url, { 
        method: 'POST', 
        headers: { 
            'Content-Type': 'application/json',
            'X-goog-api-key': s.apiKey
        }, 
        body: JSON.stringify(body), 
        signal 
    });
    
    if (!res.ok) {
        let msg = `Gemini error ${res.status}`;
        try { const err = await res.json(); if (err.error?.message) msg += ': ' + err.error.message; } catch {}
        throw new Error(msg);
    }
    if (s.streaming) await readSSE(res, onChunk); else onChunk(extractText(await res.json()));
}

async function readSSE(response, onChunk) {
    const reader = response.body.getReader(); const decoder = new TextDecoder('utf-8'); let buffer = '';
    try {
        while (true) {
            const { done, value } = await reader.read(); if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n'); buffer = lines.pop();
            for (const line of lines) {
                const trimmed = line.trim(); if (!trimmed || !trimmed.startsWith('data:')) continue;
                const jsonStr = trimmed.slice(5).trim(); if (!jsonStr || jsonStr === '[DONE]') continue;
                try { const parsed = JSON.parse(jsonStr); const text = extractText(parsed); if (text) onChunk(text); } catch {}
            }
        }
    } finally { reader.releaseLock?.(); }
}

function extractText(data) {
    try { const parts = data.candidates?.[0]?.content?.parts; return parts ? parts.map(p => p.text || '').join('') : ''; } catch { return ''; }
}

async function sendMessage() {
    if (state.generating) return;
    const input = document.getElementById('userInput'); const text = input.value.trim(); if (!text) return;

    addUserMessage(text); state.histories[state.persona].push({ role: 'user', text }); trimHistory(); persistHistories(); input.value = ''; autoResizeInput();

    const bubble = document.createElement('div'); bubble.className = 'message ai-msg';
    const content = document.createElement('div'); content.className = 'msg-content typing-bubble';
    content.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
    bubble.appendChild(content); document.getElementById('chatBox').appendChild(bubble); scrollChatToBottom();

    setGenerating(true); state.abortController = new AbortController(); let fullText = ''; let firstChunk = false;

    try {
        const messages = state.histories[state.persona].filter(m => m.text).map(m => ({ role: m.role, text: m.text }));
        await callGemini(messages, (chunk) => {
            if (!firstChunk) { firstChunk = true; content.classList.remove('typing-bubble'); }
            fullText += chunk; content.innerHTML = renderMarkdown(fullText); scrollChatToBottom();
        }, state.abortController.signal);

        if (!firstChunk || !fullText.trim()) { fullText = state.persona === 'female' ? 'Hmm, kuch jawab nahi mila. Dobara try karein? 💕' : 'Kuch response nahi aaya bro. Retry karo.'; content.classList.remove('typing-bubble'); content.innerHTML = renderMarkdown(fullText); }

        state.histories[state.persona].push({ role: 'model', text: fullText }); trimHistory(); persistHistories(); speakText(fullText);

    } catch (err) {
        content.classList.remove('typing-bubble');
        if (err.name === 'AbortError') content.innerHTML = '<em style="color:var(--muted)">Response cancelled.</em>';
        else { content.innerHTML = `<span style="color:var(--red)">⚠️ ${escapeHtml(err.message)}</span>`; toast(err.message, 'error', 5000); }
    } finally { setGenerating(false); state.abortController = null; }
}

function stopGeneration() {
    if (state.abortController) { state.abortController.abort(); state.abortController = null; }
    if (window.speechSynthesis) window.speechSynthesis.cancel();
}

function setGenerating(state_) {
    state.generating = state_; const btn = document.getElementById('sendBtn'); const input = document.getElementById('userInput'); const mic = document.getElementById('micBtn');
    if (state_) { btn.textContent = '■'; btn.classList.add('stop'); input.disabled = true; mic.disabled = true; }
    else { btn.textContent = '➤'; btn.classList.remove('stop'); input.disabled = false; mic.disabled = false; input.focus(); }
}

function loadVoices() {
    if (!('speechSynthesis' in window)) return;
    state.voices = window.speechSynthesis.getVoices() || [];
    if (state.voices.length) { state.selectedVoice.female = pickVoice('female'); state.selectedVoice.male = pickVoice('male'); }
}

function pickVoice(gender) {
    const voices = state.voices; if (!voices.length) return null;
    const langOrder = ['en-IN', 'en-US', 'en-GB', 'hi-IN', 'en'];
    const byLang = langOrder.map(l => voices.filter(v => v.lang && v.lang.toLowerCase().startsWith(l.toLowerCase()))).flat();
    const femaleNameRe = /female|woman|zira|heera|samantha|karen|victoria|ava|jenny|aria|siri|aditi|kalpana/i;
    const maleNameRe = /male|man|david|ravi|alex|daniel|fred|tom|ravi|rishi|prabhat/i;
    const pool = byLang.length ? byLang : voices;
    return pool.find(v => (gender === 'female' ? femaleNameRe : maleNameRe).test(v.name)) || pool[0] || null;
}

function stripForSpeech(text) {
    let clean = text.replace(/```[\s\S]*?```/g, ' code block ').replace(/\[([^\]]+)\]\([^)]+\)/g, '$1').replace(/[*_#`>~]/g, ' ').replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}]/gu, '').replace(/\s+/g, ' ').trim();
    if (clean.length > TTS_MAX_CHARS) clean = clean.slice(0, TTS_MAX_CHARS) + ' …baqi text chat mein hai.';
    return clean;
}

function speakText(text) {
    if (state.muted || !('speechSynthesis' in window)) return;
    const clean = stripForSpeech(text); if (!clean) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(clean); utter.lang = 'en-IN'; utter.volume = 1;
    const voice = state.selectedVoice[state.persona]; if (voice) utter.voice = voice;
    if (state.persona === 'female') { utter.pitch = 1.35; utter.rate = 1.02; } else { utter.pitch = 0.75; utter.rate = 0.98; }
    const box = document.getElementById('avatarBox'); box.classList.add('speaking');
    utter.onend = () => box.classList.remove('speaking'); utter.onerror = () => box.classList.remove('speaking');
    window.speechSynthesis.speak(utter);
}

let recognition = null;
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SR(); recognition.lang = 'ur-PK'; recognition.continuous = false; recognition.interimResults = false;
    recognition.onresult = (e) => { document.getElementById('userInput').value = e.results[0][0].transcript; autoResizeInput(); sendMessage(); };
    recognition.onerror = () => { state.listening = false; document.getElementById('micBtn').classList.remove('listening'); };
    recognition.onend = () => { state.listening = false; document.getElementById('micBtn').classList.remove('listening'); };
}

function toggleVoiceInput() {
    if (!recognition) { toast('Voice not supported.', 'error'); return; }
    if (state.generating) return;
    if (state.listening) recognition.stop();
    else { try { recognition.start(); state.listening = true; document.getElementById('micBtn').classList.add('listening'); } catch (e) {} }
}

function autoResizeInput() {
    const t = document.getElementById('userInput'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 100) + 'px';
}

function bindEvents() {
    document.getElementById('composer').addEventListener('submit', (e) => { e.preventDefault(); if (state.generating) stopGeneration(); else sendMessage(); });
    document.getElementById('userInput').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!state.generating) sendMessage(); } });
    document.getElementById('userInput').addEventListener('input', autoResizeInput);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && state.generating) stopGeneration(); });
    document.getElementById('switchBtn').addEventListener('click', togglePersona);
    document.getElementById('muteBtn').addEventListener('click', toggleMute);
    document.getElementById('settingsBtn').addEventListener('click', toggleSettings);
    document.getElementById('settingsClose').addEventListener('click', toggleSettings);
    document.getElementById('micBtn').addEventListener('click', toggleVoiceInput);
    ['apiKeyInput', 'proxyInput', 'modelSelect', 'streamToggle'].forEach(id => document.getElementById(id).addEventListener('change', saveSettings));

    document.getElementById('avatarUpload').addEventListener('change', (e) => {
        const file = e.target.files[0]; if (!file) return;
        if (file.size > 2 * 1024 * 1024) { toast('Photo 2MB se choti honi chahiye.', 'error'); return; }
        const reader = new FileReader();
        reader.onload = ev => { state.customAvatars[state.persona] = ev.target.result; updateAvatarDisplay(); toast('Photo updated ✓', 'success'); };
        reader.readAsDataURL(file); e.target.value = '';
    });
}

function init() {
    loadHistories(); loadSettingsIntoUI(); updateStatusBar(); updateAvatarDisplay(); bindEvents();
    if ('speechSynthesis' in window) { loadVoices(); window.speechSynthesis.onvoiceschanged = loadVoices; }
    if (state.histories[state.persona].length === 0) addAiMessage('Suno jaan ❤️ Main Aria hoon — tumhari romantic AI companion. Kuch bhi poocho: essay, studies, coding, ya bas dil ki baat. Main tumhari har baat sunungi!', true);
    else renderChatFromHistory();
}

init();
</script>
