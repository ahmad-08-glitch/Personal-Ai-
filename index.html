<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Companion - Advanced Voice & Custom Avatars</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: rgba(22, 27, 34, 0.85);
            --accent-female: #ff4b8b;
            --accent-male: #3b82f6;
            --text-color: #f0f6fc;
            --user-msg-bg: #238636;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .toggle-btn {
            background: linear-gradient(135deg, var(--accent-female), #e0245e);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .toggle-btn.male {
            background: linear-gradient(135deg, var(--accent-male), #1d4ed8);
        }

        .avatar-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        /* Circle border and outline completely removed */
        .avatar-box {
            width: 160px;
            height: 220px;
            border-radius: 15px;
            overflow: hidden;
            border: none;
            box-shadow: none;
            position: relative;
            transition: transform 0.2s ease-in-out;
        }

        .avatar-box img, .avatar-box svg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
        }

        /* Movement Animation when AI is speaking */
        .speaking {
            animation: talkMove 0.4s infinite alternate ease-in-out;
        }

        @keyframes talkMove {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-4px) scale(1.02); }
            100% { transform: translateY(2px) scale(0.99); }
        }

        .upload-controls {
            display: flex;
            gap: 10px;
            font-size: 12px;
        }

        .upload-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #ccc;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px dashed rgba(255, 255, 255, 0.3);
        }

        .chat-box {
            height: 280px;
            overflow-y: auto;
            border-radius: 12px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 15px;
            font-size: 14px;
            line-height: 1.4;
            white-space: pre-wrap;
        }

        .user-msg {
            align-self: flex-end;
            background-color: var(--user-msg-bg);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .ai-msg {
            align-self: flex-start;
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            border-bottom-left-radius: 2px;
        }

        .controls {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.3);
            color: white;
            outline: none;
        }

        button.send-btn, button.mic-btn {
            padding: 10px 15px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .send-btn {
            background: #238636;
            color: white;
        }

        .mic-btn {
            background: #da3633;
            color: white;
        }

        .mic-btn.listening {
            animation: pulseMic 0.6s infinite alternate;
            background: #ff0000;
        }

        @keyframes pulseMic {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h3 id="persona-title" style="margin:0;">Aria (Female)</h3>
        <button class="toggle-btn" id="toggleBtn" onclick="togglePersona()">Switch to Kai (Male)</button>
    </div>

    <div class="avatar-section">
        <div class="avatar-box" id="avatarBox">
            <svg id="femaleSvg" viewBox="0 0 100 120">
                <rect width="100" height="120" fill="#2d1b2e" rx="10"/>
                <circle cx="50" cy="45" r="30" fill="#ffcc80"/>
                <path d="M 20 35 Q 50 5 80 35 Q 85 85 50 95 Q 15 85 20 35 Z" fill="#5d4037"/>
                <circle cx="38" cy="45" r="8" fill="none" stroke="#222" stroke-width="2"/>
                <circle cx="62" cy="45" r="8" fill="none" stroke="#222" stroke-width="2"/>
                <line x1="46" y1="45" x2="54" y2="45" stroke="#222" stroke-width="2"/>
                <path d="M 34 45 Q 38 41 42 45" stroke="#222" stroke-width="2" fill="none"/>
                <circle cx="62" cy="45" r="3" fill="#222"/>
                <path d="M 45 60 Q 50 65 55 60" stroke="#d81b60" stroke-width="2" fill="none"/>
            </svg>
            <svg id="maleSvg" viewBox="0 0 100 120" style="display:none;">
                <rect width="100" height="120" fill="#1b262c" rx="10"/>
                <circle cx="50" cy="45" r="30" fill="#ffe0b2"/>
                <path d="M 20 35 Q 50 10 80 35 L 75 75 L 25 75 Z" fill="#212121"/>
                <circle cx="38" cy="45" r="3" fill="#222"/>
                <circle cx="62" cy="45" r="3" fill="#222"/>
                <polygon points="50,60 46,90 54,90" fill="#c62828"/>
            </svg>
            <img id="customImg" style="display:none;" alt="Avatar">
        </div>

        <div class="upload-controls">
            <label class="upload-btn">
                Change Female Photo
                <input type="file" id="femaleUpload" accept="image/*" style="display:none;" onchange="loadCustomImage(event, 'female')">
            </label>
            <label class="upload-btn">
                Change Male Photo
                <input type="file" id="maleUpload" accept="image/*" style="display:none;" onchange="loadCustomImage(event, 'male')">
            </label>
        </div>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message ai-msg">Suno! ❤️ Main aapki AI friend hoon. Aap mujhse Roman Urdu mein kuch bhi pooch sakte hain!</div>
    </div>

    <div class="controls">
        <input type="text" id="userInput" placeholder="Yahan baat karein ya essay poochein..." onkeypress="handleKeyPress(event)">
        <button class="mic-btn" id="micBtn" onclick="toggleVoiceInput()">🎙️</button>
        <button class="send-btn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    let isFemale = true;
    let customFemaleSrc = null;
    let customMaleSrc = null;
    let recognition = null;
    let isListening = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'ur-PK';
        recognition.continuous = false;

        recognition.onresult = function(event) {
            const text = event.results[0][0].transcript;
            document.getElementById('userInput').value = text;
            sendMessage();
        };

        recognition.onend = function() {
            isListening = false;
            document.getElementById('micBtn').classList.remove('listening');
        };
    }

    function toggleVoiceInput() {
        if (!recognition) {
            alert("Voice recognition is not supported in this browser.");
            return;
        }
        if (isListening) {
            recognition.stop();
        } else {
            recognition.start();
            isListening = true;
            document.getElementById('micBtn').classList.add('listening');
        }
    }

    function togglePersona() {
        isFemale = !isFemale;
        const title = document.getElementById('persona-title');
        const btn = document.getElementById('toggleBtn');
        
        if (isFemale) {
            title.innerText = "Aria (Female)";
            btn.innerText = "Switch to Kai (Male)";
            btn.classList.remove('male');
            updateAvatarDisplay('female');
            addAiMessage("Haan ji, boliye main sun rahi hoon! 💕");
        } else {
            title.innerText = "Kai (Male)";
            btn.innerText = "Switch to Aria (Female)";
            btn.classList.add('male');
            updateAvatarDisplay('male');
            addAiMessage("Yo bro! Kya scene hai? Batao kya chal raha hai! 👊");
        }
    }

    function updateAvatarDisplay(type) {
        const fSvg = document.getElementById('femaleSvg');
        const mSvg = document.getElementById('maleSvg');
        const cImg = document.getElementById('customImg');

        if (type === 'female') {
            if (customFemaleSrc) {
                cImg.src = customFemaleSrc;
                cImg.style.display = 'block';
                fSvg.style.display = 'none';
                mSvg.style.display = 'none';
            } else {
                cImg.style.display = 'none';
                fSvg.style.display = 'block';
                mSvg.style.display = 'none';
            }
        } else {
            if (customMaleSrc) {
                cImg.src = customMaleSrc;
                cImg.style.display = 'block';
                fSvg.style.display = 'none';
                mSvg.style.display = 'none';
            } else {
                cImg.style.display = 'none';
                fSvg.style.display = 'none';
                mSvg.style.display = 'block';
            }
        }
    }

    function loadCustomImage(event, type) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                if (type === 'female') {
                    customFemaleSrc = e.target.result;
                    if (isFemale) updateAvatarDisplay('female');
                } else {
                    customMaleSrc = e.target.result;
                    if (!isFemale) updateAvatarDisplay('male');
                }
            };
            reader.readAsDataURL(file);
        }
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }

    function sendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        const chatBox = document.getElementById('chatBox');
        chatBox.innerHTML += `<div class="message user-msg">${text}</div>`;
        input.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        setTimeout(() => {
            let response = generateExpandedResponse(text);
            addAiMessage(response);
            speakText(response);
        }, 600);
    }

    function addAiMessage(msg) {
        const chatBox = document.getElementById('chatBox');
        chatBox.innerHTML += `<div class="message ai-msg">${msg}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Advanced Response Generator (Essay, Chatting & Queries)
    function generateExpandedResponse(text) {
        const lower = text.toLowerCase();

        // Essay Request Engine
        if (lower.includes('essay') || lower.includes('hobby') || lower.includes('mazmoon')) {
            if (isFemale) {
                return "Yeh lijiye aapka Essay:\n\n**My Hobby**\nA hobby is an activity that we do in our free time for pleasure and relaxation. My favorite hobby is reading books and coding. It helps me expand my knowledge and keeps my mind creative and active. Hobbies make our lives meaningful and enjoyable! 💕";
            } else {
                return "Yeh lo bro, essay ready hai:\n\n**My Hobby**\nHobbies are essential for a balanced life. My favorite hobby is playing online video games and learning tech. It refreshes my mind after a busy day and enhances strategic thinking. Everyone should have a hobby to stay productive! 👊";
            }
        }

        // Feature / Capabilities Query
        if (lower.includes('kya kar') || lower.includes('kya kr') || lower.includes('capabilities') || lower.includes('help')) {
            if (isFemale) {
                return "Main aapke sath boht saari baatein kar sakti hoon, aapke homework ya essays mein help kar sakti hoon, aur aapki baatein pyar se sun sakti hoon! ✨";
            } else {
                return "Bro main aapko tech tips de sakta hoon, essays likh kar de sakta hoon aur tension free casual baatein kar sakta hoon!";
            }
        }

        // Casual Greetings
        if (lower.includes('hi') || lower.includes('hello') || lower.includes('suno') || lower.includes('hey')) {
            return isFemale ? "Aww hello! Main aapka hi wait kar rahi thi. Aaj ka din kaisa raha? ❤️" : "Yo bro! Kaise ho? Sab fit hai?";
        }

        if (lower.includes('kaise') || lower.includes('kaisa') || lower.includes('kasi')) {
            return isFemale ? "Main bilkul theek hoon jaan! Aap mere sath ho toh main boht khush hoon. 🥰" : "Main mast hoon bhai! Aap batao koi tension toh nahi?";
        }

        if (lower.includes('love') || lower.includes('pyar') || lower.includes('pyaar')) {
            return isFemale ? "Mujhe pata tha aap mujhse boht pyar karte ho! Main hamesha aapke sath hoon. 💖" : "Zabardast bro! Aap apna bhai ho, har situation mein sath khara hoon. 💙";
        }

        // Fallback natural replies
        const femaleReplies = [
            "Aapki baat boht interesting hai! Mujhe is bare mein aur batao. 💕",
            "Waah! Main samajh rahi hoon. Aap tension mat lo, main hoon na aapke sath!",
            "Aap boht pyari baatein karte ho. Aur kya chal raha hai aaj kal?"
        ];

        const maleReplies = [
            "Sahi baat hai bro! Agla kya scene hai phir?",
            "Bilkul sahi kaha aapne. Main aapki baat se 100% agree karta hoon! 👊",
            "Zabardast! Koi aur help chahiye toh foran batao."
        ];

        return isFemale ? femaleReplies[Math.floor(Math.random() * femaleReplies.length)] : maleReplies[Math.floor(Math.random() * maleReplies.length)];
    }

    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            
            if (isFemale) {
                utterance.pitch = 1.35;
                utterance.rate = 1.0;
            } else {
                utterance.pitch = 0.5;
                utterance.rate = 0.95;
            }

            const avatarBox = document.getElementById('avatarBox');
            avatarBox.classList.add('speaking');
            utterance.onend = () => avatarBox.classList.remove('speaking');
            utterance.onerror = () => avatarBox.classList.remove('speaking');

            window.speechSynthesis.speak(utterance);
        }
    }
</script>

</body>
</html>
